openapi: 3.1.0
info:
  title: Putokaz API
  version: 0.1.0
  description: |
    Ugovor FE/BE. Živi spec: GET /openapi.json (FastAPI).
    Kartice kandidata nemaju instituciju. Adresa šaltera samo u guide posle select.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: DB + broj seed zapisa
  /health/llm:
    get:
      summary: Ping xAI (models)
  /cases:
    post:
      summary: Matching iz teksta (gost ili Bearer)
      description: >
        Demo keš za dve rečenice, inače xAI nad katalogom (slug/title/summary/examples).
        Kartice bez institucije. document_ids samo iz novčanika ulogovanog.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                document_ids:
                  type: array
                  items: { type: string, format: uuid }
  /cases/{case_id}:
    get:
      summary: Case + kandidati (gost, UUID)
  /cases/{case_id}/retry:
    post:
      summary: Dopuni opis, isti prilozi
      description: Bez demo keša (isto kao /clarify). Keš važi samo za tačnu demo rečenicu na POST /cases.
  /cases/{case_id}/clarify:
    post:
      summary: Odgovori na podpitanja
      description: Bez demo keša. raw_text se ne prepisuje.
  /cases/{case_id}/select:
    post:
      summary: Izbor procedure → guide + office
      description: >
        Bez mesta ne bira nasumičan PU. office_missing + office_missing_reason
        (npr. „Nedostaje mesto prebivališta“). Ako retry doda mesto, isti resolver.
  /cases/{case_id}/guide:
    get:
      summary: Vodič posle select
  /cases/{case_id}/documents:
    post:
      summary: Prilog uz case (gost), multipart file
  /cases/{case_id}/document-status:
    get:
      summary: Checklist vs required_documents
      description: >
        Posle select. complete / missing / expired / unreadable / mismatch
        prema poljima sa skena. Bez fajla: missing + „Nije priložen.“
        PDF/nečitko: unreadable. Istekao datum: expired. Nije pravna overa.
  /auth/register:
    post: { summary: Nalog; vraća JWT + user_id/email/name }
  /auth/login:
    post: { summary: Login JWT }
  /auth/refresh:
    post: { summary: Refresh JWT }
  /me:
    get: { summary: Profil + GDPR/retention tekst }
  /me/claim:
    post: { summary: Preuzmi gostov case i priloge u novčanik }
  /documents:
    get: { summary: Novčanik (samo vlasnik) }
    post: { summary: Upload u novčanik, AES-GCM }
  /documents/{document_id}:
    delete: { summary: Obriši svoj dokument }
  /me/dashboard:
    get: { summary: Dokumenti + case-ovi }
