services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nasalter
      POSTGRES_PASSWORD: nasalter
      POSTGRES_DB: nasalter
    ports:
      - "5432:5432"
    volumes:
      - nasalter_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasalter"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://nasalter:nasalter@postgres:5432/nasalter
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      JWT_SECRET: ${JWT_SECRET:-dev-compose-secret}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./seed:/app/seed
      - ./uploads:/app/uploads

volumes:
  nasalter_pg:
